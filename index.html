<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkReel</title>
</head>
<body style="font-family:sans-serif;text-align:center;padding:30px">
  <h1>LinkReel</h1>
  <p>Paste a link and get a video.</p>
  <input id="link" type="text" placeholder="Paste your link here" style="width:80%;padding:10px">
  <br><br>
  <button onclick="generate()" style="padding:10px 20px">Generate Video</button>
  <p id="result" style="white-space:pre-wrap;text-align:left"></p>

  <script>
    const BACKEND_URL = "https://linkreel-backend.onrender.com";

    async function generate() {
      const link = document.getElementById("link").value.trim();
      const result = document.getElementById("result");
      result.textContent = "Reading the link... the first try can take about a minute.";
      try {
        const res = await fetch(BACKEND_URL + "/read", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: link })
        });
        const data = await res.json();
        if (data.error) {
          result.textContent = data.error;
          return;
        }
        result.textContent = "Title: " + data.title + "\n\n" + data.text;
      } catch (e) {
        result.textContent = "Could not reach the backend.";
      }
    }
  </script>
</body>
</html>
