<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkReel</title>
</head>
<body style="font-family:sans-serif;text-align:center;padding:30px">
  <h1>LinkReel</h1>
  <p>Paste a link and get a video.</p>
  <input id="link" type="text" placeholder="Paste your link here" style="width:80%;padding:10px">
  <br><br>
  <textarea id="instructions" rows="3" placeholder="Optional: tell it what to focus on (e.g. make a promo video for my school, mention admissions)" style="width:80%;padding:10px"></textarea>
  <br>
  <label><input id="crawl" type="checkbox"> Use the whole website (up to 5 pages)</label>
  <br><br>
  <button onclick="generate()" style="padding:10px 20px">Generate Video</button>
  <p id="result" style="white-space:pre-wrap;text-align:left"></p>
  <audio id="player" controls style="display:none;width:90%"></audio>
  <p id="status"></p>
  <video id="video" controls playsinline style="display:none;width:90%;max-width:360px"></video>
  <br>
  <a id="download" style="display:none;padding:10px 20px;background:#eee;color:#000;text-decoration:none;border:1px solid #888">Download video</a>

  <script>
    const BACKEND_URL = "https://linkreel-backend.onrender.com";

    async function generate() {
      const link = document.getElementById("link").value.trim();
      const instructions = document.getElementById("instructions").value.trim();
      const crawl = document.getElementById("crawl").checked;
      const result = document.getElementById("result");
      const player = document.getElementById("player");
      const status = document.getElementById("status");
      const video = document.getElementById("video");
      const dl = document.getElementById("download");
      player.style.display = "none";
      video.style.display = "none";
      dl.style.display = "none";
      status.textContent = "";
      result.textContent = crawl
        ? "Reading the website... this can take 2 to 3 minutes."
        : "Working... the first try can take a minute or two.";
      try {
        const res = await fetch(BACKEND_URL + "/read", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: link, instructions: instructions, crawl: crawl })
        });
        const data = await res.json();
        if (data.error) {
          result.textContent = data.error;
          return;
        }
        result.textContent = data.script + "\n\n(Pages read: " + data.pagesRead + ")";
        if (data.audio) {
          player.src = "data:audio/mpeg;base64," + data.audio;
          player.style.display = "block";
        } else {
          result.textContent += "\n\n(Voice failed: " + data.audioError + ")";
        }
        if (data.jobId) {
          poll(data.jobId);
        }
      } catch (e) {
        result.textContent = "Could not reach the backend.";
      }
    }

    async function poll(id) {
      const status = document.getElementById("status");
      const video = document.getElementById("video");
      const dl = document.getElementById("download");
      status.textContent = "Building the video... this can take a few minutes.";
      for (let i = 0; i < 120; i++) {
        await new Promise((r) => setTimeout(r, 5000));
        try {
          const res = await fetch(BACKEND_URL + "/job/" + id);
          const j = await res.json();
          if (j.status === "done") {
            video.src = BACKEND_URL + "/video/" + id;
            video.style.display = "block";
            dl.href = BACKEND_URL + "/video/" + id + "?download=1";
            dl.style.display = "inline-block";
            status.textContent = "Video ready!";
            return;
          }
          if (j.status === "error") {
            status.textContent = "Video failed: " + j.error;
            return;
          }
        } catch (e) {}
      }
      status.textContent = "The video is taking too long. Please try again.";
    }
  </script>
</body>
</html>
