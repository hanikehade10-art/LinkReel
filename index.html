<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkReel</title>
</head>
<body style="font-family:sans-serif;text-align:center;padding:30px">
  <h1>LinkReel</h1>
  <p>Paste a link and get a video.</p>
  <input id="link" type="text" placeholder="Paste your link here" style="width:80%;padding:10px">
  <br><br>
  <button onclick="generate()" style="padding:10px 20px">Generate Video</button>
  <p id="result" style="white-space:pre-wrap;text-align:left"></p>
  <audio id="player" controls style="display:none;width:90%"></audio>

  <script>
    const BACKEND_URL = "https://linkreel-backend.onrender.com";

    async function generate() {
      const link = document.getElementById("link").value.trim();
      const result = document.getElementById("result");
      const player = document.getElementById("player");
      player.style.display = "none";
      result.textContent = "Working... the first try can take a minute or two.";
      try {
        const res = await fetch(BACKEND_URL + "/read", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: link })
        });
        const data = await res.json();
        if (data.error) {
          result.textContent = data.error;
          return;
        }
        result.textContent = data.script;
        if (data.audio) {
          player.src = "data:audio/mpeg;base64," + data.audio;
          player.style.display = "block";
        } else {
          result.textContent += "\n\n(Voice failed: " + data.audioError + ")";
        }
      } catch (e) {
        result.textContent = "Could not reach the backend.";
      }
    }
  </script>
</body>
</html>
